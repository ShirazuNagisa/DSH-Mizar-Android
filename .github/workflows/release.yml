name: release

# Tag-driven, as the project ships: `git tag v0.8.0 && git push --tags` builds the
# signed APK and attaches it to the GitHub release. The version in the tag must match
# versionName in app/build.gradle.kts -- the workflow checks, because an APK whose
# build number disagrees with its release page is a bug nobody notices until an
# upgrade fails.
on:
  push:
    tags: ['v*']
  # Also runnable by hand: a pipeline that can only be exercised by cutting a
  # release is a pipeline nobody tests, and this one was red for three tags
  # before anybody noticed. A dispatch builds and verifies but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Named packages, never the action's default. That default is
      # `tools platform-tools`, and Google removed the legacy `tools` package
      # from the SDK repository -- so the bare action fails in sdkmanager with
      # "Failed to find package 'tools'" before any of this workflow runs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MIZAR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          # Whitespace only ever arrives by accident -- a wrapped paste, a trailing
          # newline, a space from an editor -- and `base64 -d` rejects a space
          # outright ("invalid input"), so it is stripped rather than trusted.
          value=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          [ -n "$value" ] \
            || { echo 'MIZAR_KEYSTORE_BASE64 is empty or not set; add the MIZAR_* secrets' >&2; exit 1; }
          printf '%s' "$value" | base64 -d > keystore/release.jks 2>/dev/null \
            || { echo "MIZAR_KEYSTORE_BASE64 is not base64 (${#value} characters after trimming)" >&2; exit 1; }
          [ -s keystore/release.jks ] \
            || { echo 'the decoded keystore is empty' >&2; exit 1; }
          echo "keystore decodes to $(wc -c < keystore/release.jks) bytes"

      - name: Build
        env:
          MIZAR_KEYSTORE: keystore/release.jks
          MIZAR_KEYSTORE_PASSWORD: ${{ secrets.MIZAR_KEYSTORE_PASSWORD }}
          MIZAR_KEY_ALIAS: ${{ secrets.MIZAR_KEY_ALIAS }}
          MIZAR_KEY_PASSWORD: ${{ secrets.MIZAR_KEY_PASSWORD }}
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          # The tag check only applies to a tag: a dispatch has no version to agree
          # with, and its job is to prove the build still works.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$version" ] || { echo "tag $tag != versionName $version" >&2; exit 1; }
          fi
          ./gradlew :mizarkit:test :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dsh-mizar-${version}.apk"

      - name: Verify the APK is signed
        run: |
          apk=$(ls dist/*.apk)
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /dev/null \
            || { echo "the release apk is not signed; check the MIZAR_* secrets" >&2; exit 1; }
          echo "signed: $apk"

      # Publishes on a tag only, so a manual run never moves a release.
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*.apk
          generate_release_notes: true