name: release

# Tag-driven, as the project ships: `git tag v0.8.0 && git push --tags` builds the
# signed APK and attaches it to the GitHub release. The version in the tag must match
# versionName in app/build.gradle.kts -- the workflow checks, because an APK whose
# build number disagrees with its release page is a bug nobody notices until an
# upgrade fails.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Named packages, never the action's default. That default is
      # `tools platform-tools`, and Google removed the legacy `tools` package
      # from the SDK repository -- so the bare action fails in sdkmanager with
      # "Failed to find package 'tools'" before any of this workflow runs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MIZAR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build
        env:
          MIZAR_KEYSTORE: keystore/release.jks
          MIZAR_KEYSTORE_PASSWORD: ${{ secrets.MIZAR_KEYSTORE_PASSWORD }}
          MIZAR_KEY_ALIAS: ${{ secrets.MIZAR_KEY_ALIAS }}
          MIZAR_KEY_PASSWORD: ${{ secrets.MIZAR_KEY_PASSWORD }}
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          [ "$tag" = "$version" ] || { echo "tag $tag != versionName $version" >&2; exit 1; }
          ./gradlew :mizarkit:test :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dsh-mizar-${version}.apk"

      - name: Verify the APK is signed
        run: |
          apk=$(ls dist/*.apk)
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /dev/null \
            || { echo "the release apk is not signed; check the MIZAR_* secrets" >&2; exit 1; }
          echo "signed: $apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true